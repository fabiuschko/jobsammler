name: Stellen sammeln

on:
  schedule:
    - cron: "30 4 * * *"   # täglich 04:30 UTC (05:30 Uhr Winterzeit / 06:30 Uhr Sommerzeit in Berlin)
  workflow_dispatch:        # manuell startbar über "Run workflow"

permissions:
  contents: write           # damit der Lauf data/ ins Repository schreiben darf

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pakete installieren
        run: pip install -r requirements.txt

      - name: Stellen sammeln
        run: python collect.py

      - name: Ergebnis ins Repository schreiben
        run: |
          git config user.name "jobsammler-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/run.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Stellen vom $(TZ=Europe/Berlin date +%F)"
            git push
          fi
