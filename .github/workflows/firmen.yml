name: Firmen-Finder (manuell)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: OpenRegister abfragen
        env:
          OPENREGISTER_API_KEY: ${{ secrets.OPENREGISTER_API_KEY }}
        run: python firmen/query.py
      - name: Ergebnis speichern
        run: |
          git config user.name "firmen-bot"
          git config user.email "firmen-bot@users.noreply.github.com"
          git add data/firmen
          git commit -m "Firmen-Abfrage $(date -u +%F)" || echo "nichts neu"
          git pull --rebase -q && git push
